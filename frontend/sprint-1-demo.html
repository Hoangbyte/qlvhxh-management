async function api(path,{auth=false,...options}={}){

  if(options.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');
  if(auth&&S.sessionId)headers.set('Authorization',`Bearer ${S.sessionId}`);
  const response=await fetch(`${API_BASE_URL}${path}`,{...options,headers});
  let result;
  try{result=await response.json()}catch{throw new ApiError(response.status,'INVALID_RESPONSE','Backend trả về phản hồi không hợp lệ.')}

    throw new ApiError(response.status,result.error?.code||'API_ERROR',result.error?.message||`Backend phản hồi HTTP ${response.status}.`);
  }
  return result.data;
}

async function loadTaskList(scopeName='mine'){

    const data=await api(`/api/tasks?scope=${encodeURIComponent(scopeName)}`,{auth:true});
    if(requestId===S.taskRequestId&&sessionId===S.sessionId)S.taskItems=(data.items||[]).map(taskFromApi);
  }catch(error){if(requestId===S.taskRequestId&&sessionId===S.sessionId)S.taskError=error.message}
  finally{if(requestId===S.taskRequestId&&sessionId===S.sessionId){S.taskLoading=false;render()}}
}

  }catch(error){if(requestId===S.detailRequestId&&sessionId===S.sessionId)S.taskError=error.message}

async function doLogin(e){
  e.preventDefault();const username=$('#un').value.trim(),password=$('#pw').value;

  try{await startSession(await api('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})}))}

  finally{S.authBusy=false;render()}

  const progress=Number($('#pr').value),note=$('#nt').value.trim();

  try{
    await api(`/api/tasks/${id}/progress`,{method:'PATCH',auth:true,body:JSON.stringify({new_status:status,progress_percent:progress,note,row_ver:task.rowVer})});
    const listScope=S.v==='tasks'&&S.p.all?'all':'mine';

const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const bar=p=>`<div class="bar" title="${p}%"><i style="width:${p}%"></i></div>`;
function demoBar(){return `<div class="demo"><b>Chế độ trình diễn</b>${S.demoEnabled?S.demoRoles.map(role=>`<button class="chip ${S.u.id===role.user_id&&S.activeRole.role_id===role.role_id?'on':''}" onclick="quickLogin(${role.role_id},${role.user_id})">${esc(R[role.role_code]?.[1]||role.role_code)}</button>`).join(''):''}<span class="demo-note">Hôm nay, thông báo và hồ sơ vẫn dùng dữ liệu mẫu.</span></div>`}
function login(){return `<div class="lg"><section><h1 style="font-size:24px;line-height:1.25;margin:0 0 6px">Quản lý Phòng Văn hóa – Xã hội</h1><p class="mu" style="margin:0 0 18px">Đăng nhập để xem việc hôm nay, thông báo và hồ sơ đang chờ bạn.</p>
<form onsubmit="doLogin(event)" novalidate><label>Tài khoản<input type="text" id="un" autocomplete="username"></label><label>Mật khẩu<input type="password" id="pw" autocomplete="current-password"></label>${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}<button class="btn p" ${S.authBusy?'disabled':''}>Đăng nhập</button></form></section>
<section><div class="pill am">Tài khoản trình diễn từ máy chủ</div><h2 style="font-size:16px;margin:8px 0 0">Chọn nhanh vai trò được cấp</h2><p class="mu" style="margin:2px 0 0">Các vai trò và tài khoản mẫu do API cung cấp.</p>
${S.demoError?`<div class="err" role="alert">${esc(S.demoError)}</div>`:''}<div class="roles">${S.demoRoles.map(role=>`<button class="rc ${role.role_level==='LEADER'?'ld':''}" onclick="quickLogin(${role.role_id},${role.user_id})" ${S.authBusy?'disabled':''}><b>${esc(role.role_name)}</b><div class="mu">${esc(role.full_name)}</div></button>`).join('')||'<div class="empty">Không có vai trò trình diễn khả dụng.</div>'}</div></section></div>`}
function side(){const nv=(k,l,x='')=>`<button class="nv ${S.v===k?'on':''}" onclick="nav('${k}')">${l}${x}</button>`,dim=(l,s)=>`<button class="nv dim" onclick="toast('${l}: làm ở Sprint ${s}')">${l}<span class="tag">S${s}</span></button>`;
  const w=waiting().length;
  return `<aside><div class="brand">Phòng Văn hóa – Xã hội</div><div class="grp">Công việc</div>${nv('today','Hôm nay')}${nv('mine','Việc của tôi')}${nv('docs','Hồ sơ chờ xử lý',w?`<span class="bd">${w}</span>`:'')}${canAppr()?nv('appr','Hồ sơ chờ ký',S.r==='PTP'?'<span class="tag">Ủy quyền</span>':apprs().length?`<span class="bd">${apprs().length}</span>`:''):''}
<div class="grp">Văn bản</div>${dim('Văn bản đến',2)}${dim('Sổ và tra cứu văn bản',2)}${dim('Văn bản đi và soạn thảo',2)}<div class="grp">Điều hành</div>${dim('Theo dõi nhiệm vụ',3)}${isL()?dim('Tổng hợp giao ban',3):''}${dim('Lịch họp lãnh đạo',3)}</aside>`}
const TITLE={today:'Hôm nay',mine:'Việc của tôi',tasks:'Danh sách việc',docs:'Hồ sơ chờ xử lý',appr:'Hồ sơ chờ ký',task:'Chi tiết nhiệm vụ',doc:'Chi tiết hồ sơ'};
function topbar(){const rs=S.availableRoles;
  return `<div class="top"><h1>${S.back?`<button class="btn" onclick="goBack()" aria-label="Quay lại">‹ Quay lại</button> `:''}${S.v==='tasks'&&S.p.title?S.p.title:TITLE[S.v]}</h1>
<button class="btn" onclick="nav('today')" aria-label="Thông báo chưa đọc">Thông báo ${unread()?`<span class="bd">${unread()}</span>`:''}</button>
<button class="btn" onclick="S.pop=!S.pop;render()"><span class="mu">${esc(S.u.full_name)} · </span>${esc(S.activeRole.name)} ▾</button><button class="btn" onclick="logout()">Đăng xuất</button>
${S.pop?`<div class="pop"><div class="mu" style="padding:6px 8px">Vai trò được cấp cho tài khoản</div>${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}${rs.map(r=>`<button onclick="pickRole(${r.role_id})">${r.role_id===S.activeRole.role_id?'✓ ':''}${esc(r.name)}</button>`).join('')}${rs.length<2?'<div class="mu" style="padding:6px 8px">Tài khoản này chỉ có một vai trò.</div>':''}</div>`:''}</div>`}
function cards(){const T=scope(),n=k=>T.filter(t=>dl(t)===k).length,L=isL(),c=[];
  if(canAppr())c.push(['Hồ sơ chờ ký',apprs().length,'',()=>`nav('appr')`]);
  c.push(['Việc quá hạn',n('OVERDUE'),'rd',`nav('tasks',{dl:'OVERDUE',all:${L?1:0},title:'Việc quá hạn'})`],['Việc sắp hạn',n('DUE_SOON'),'am',`nav('tasks',{dl:'DUE_SOON',all:${L?1:0},title:'Việc sắp hạn'})`]);
  if(L)c.push(['Văn bản cần chỉ đạo',direction().length,'',`nav('docs',{k:'dir'})`]);
  c.push(['Hồ sơ chờ tôi',waiting().length,'',`nav('docs')`]);
  if(L)c.push(['Đề xuất gia hạn chờ duyệt',S.r==='PCT'?0:1,'',`toast('Duyệt gia hạn: làm ở Sprint 2')`]);
  c.push(['Việc đang giao cho tôi',mineT().filter(t=>t.st!=='DONE').length,'',`nav('mine')`]);return c}
function today(){const L=isL(),n=notes(),shown=S.nAll?n:n.slice(0,5);
  const wl=waiting().slice(0,4),Q=L?['Việc nào đang quá hạn?','Hồ sơ nào đang chờ ký?','Tiến độ từng lĩnh vực hôm nay?']:['Việc nào của tôi sắp đến hạn?','Hồ sơ nào đang chờ tôi xử lý?','Tôi còn bao nhiêu việc quá hạn?'];
  return `<p class="mu" style="margin:-8px 0 12px">${T0.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'})} · Số liệu ${L?'toàn phòng':'của riêng bạn'}</p>
<div class="band">${cards().map(c=>`<button class="cell ${c[2]}" onclick="${typeof c[3]==='function'?c[3]():c[3]}"><strong>${c[1]}</strong><span>${c[0]}</span></button>`).join('')}</div>
<div class="cols"><div><div class="pn"><h2>Hồ sơ chờ tôi <button class="btn" onclick="nav('docs')">Xem tất cả</button></h2>${wl.length?wl.map(docRow).join(''):'<div class="empty">Không có hồ sơ nào đang chờ bạn.</div>'}</div>
<div class="pn" style="margin-top:16px"><h2>Hỏi tình hình</h2><div class="ask"><input type="text" id="q" placeholder="Nhập câu hỏi về việc, hồ sơ, tiến độ…" onkeydown="event.key==='Enter'&&ask()"><button class="btn p" onclick="ask()">Gửi</button></div><div class="chips">${Q.map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><div class="mu" id="qa" style="padding:0 14px 12px" aria-live="polite"></div></div></div>
<div class="pn"><h2>Thông báo ${unread()?pill(unread()+' chưa đọc'):''}<button class="btn" onclick="readAll()">Đánh dấu đã đọc</button></h2>${shown.length?shown.map(x=>{const i=NOTES.indexOf(x);return `<button class="row" onclick="readNote(${i})"><span style="${x.read?'':'font-weight:700'}">${x.read?'':'<i class="dot"></i>'}${esc(x.t)}</span><span class="mu">${ago(x.h)}</span><span class="mu" style="grid-column:1/-1">${esc(x.m)}</span></button>`}).join(''):'<div class="empty">Chưa có thông báo.</div>'}${n.length>5?`<button class="row" onclick="S.nAll=!S.nAll;render()"><span class="mu">${S.nAll?'Thu gọn':'Xem thêm '+(n.length-5)+' thông báo'}</span></button>`:''}</div></div>`}
function docRow(d){const o=d.due!==null&&d.due<0;return `<button class="row" onclick="goTo('doc',{id:${d.id}})"><b>${esc(d.sym)} ${d.sec?pill('Mật','rd'):''}</b>${d.due===null?'<span></span>':pill(o?'Quá hạn '+-d.due+' ngày':'Hạn '+fmt(day(d.due)),o?'rd':'')}<span class="mu">${esc(d.sum)} · ${RS[d.r]}</span><span>${pill(DST[d.st],d.st==='DOING'?'am':'')}</span></button>`}
function filters(T){const fs=[...new Set(T.map(t=>t.f))];
  return `<div class="flt"><select aria-label="Trạng thái" onchange="setF('st',this.value)"><option value="">Mọi trạng thái</option>${Object.keys(ST).map(k=>`<option value="${k}" ${S.fl.st===k?'selected':''}>${ST[k]}</option>`).join('')}</select>
<select aria-label="Hạn xử lý" onchange="setF('dl',this.value)"><option value="">Mọi hạn</option>${[['OVERDUE','Quá hạn'],['DUE_SOON','Sắp hạn'],['ON_TRACK','Còn hạn']].map(a=>`<option value="${a[0]}" ${S.fl.dl===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select>
<select aria-label="Lĩnh vực" onchange="setF('f',this.value)"><option value="">Mọi lĩnh vực</option>${fs.map(f=>`<option value="${f}" ${+S.fl.f===f?'selected':''}>${FIELD[f]}</option>`).join('')}</select></div>`}
function tasks(){
  const all=S.v==='tasks'&&S.p.all,base=S.taskItems,F=S.fl;
  if(S.taskLoading)return'<div class="pn"><div class="empty">Đang tải nhiệm vụ...</div></div>';
  if(S.taskError)return`<div class="err" role="alert">${esc(S.taskError)} <button class="btn" onclick="loadTaskList('${all?'all':'mine'}')">Thử lại</button></div>`;
  const L=base.filter(t=>(!F.st||t.st===F.st)&&(!F.dl||taskDeadline(t)===F.dl)&&(!F.f||t.f===+F.f)).sort((a,b)=>(a.st==='DONE')-(b.st==='DONE')||(a.due||0)-(b.due||0));
  return `${filters(base)}<div class="pn">${L.length?L.map(t=>`<button class="row" onclick="goTo('task',{id:${t.id}})"><b>${esc(t.title)}</b>${pill(esc(dlLabel(t)),dlCls(t))}<span class="mu">${esc(t.code||'')} · ${esc(t.fieldName||FIELD[t.f]||'')} · Giao bởi ${esc(t.byName||'')}${all?' · Xử lý: '+esc(t.assigneeName||''):''} · ${esc(dlTxt(t))}</span><span style="display:flex;gap:8px;align-items:center">${bar(t.pr)}${pill(ST[t.st]||t.st,t.st==='DONE'?'gr':'')}</span></button>`).join(''):'<div class="empty">Không có việc nào khớp bộ lọc. Hãy bỏ bớt điều kiện lọc.</div>'}</div>`
}
function docs(){const dir=S.p.k==='dir',L=dir?direction():waiting();
  return `<div class="pn">${L.length?L.map(docRow).join(''):'<div class="empty">'+(dir?'Không có văn bản nào cần chỉ đạo.':'Không có hồ sơ nào đang chờ bạn xử lý.')+'</div>'}</div>`}
function doc(){const d=DOCS.find(x=>x.id===S.p.id),can=d&&d.to===S.u.id&&['HANDLE_MAIN','HANDLE_COORDINATE'].includes(d.r);if(!d)return'<div class="empty">Không tìm thấy hồ sơ.</div>';
  const ok=!d.sec||d.to===S.u.id||['PCT','TP'].includes(S.r);
  return `<div class="pn"><h2>${esc(d.sym)} ${d.sec?pill('Mật','rd'):''}</h2><dl class="kv"><dt>Trích yếu</dt><dd>${esc(d.sum)}</dd><dt>Loại việc</dt><dd>${RS[d.r]}</dd><dt>Hạn chót</dt><dd>${d.due===null?'Không đặt hạn':fmt(day(d.due))}</dd><dt>Ý kiến chỉ đạo</dt><dd>${esc(d.ins||'Chưa có')}</dd><dt>Tệp đính kèm</dt><dd>${ok?(d.files.length?d.files.map(f=>`<a href="#" onclick="toast('Tải tệp sẽ gọi API có kiểm quyền (Sprint 2)');return false">${f}</a>`).join(', '):'Không có'):'Văn bản mật: chỉ người được giao trực tiếp mới xem được tệp.'}</dd><dt>Trạng thái</dt><dd>${pill(DST[d.st])}</dd></dl>
${can?`<div class="fm" style="border-top:1px solid var(--ln)"><label>Cập nhật trạng thái xử lý <select id="ds">${Object.keys(DST).map(k=>`<option value="${k}" ${d.st===k?'selected':''}>${DST[k]}</option>`).join('')}</select></label><div><button class="btn p" onclick="saveDoc(${d.id})">Lưu trạng thái</button></div></div>`:`<div class="mu" style="padding:0 14px 14px">Bước tiếp theo của loại hồ sơ này (chỉ đạo, vào sổ, sửa dự thảo) làm ở Sprint 2.</div>`}</div>`}
function appr(){const L=apprs();return `<div class="pn">${L.length?L.map(a=>`<button class="row" onclick="toast('Duyệt hoặc trả lại (bắt buộc nhập lý do): làm ở Sprint 2')"><b>${a.t}</b>${pill('Chờ duyệt','am')}<span class="mu">Trình bởi ${a.by}${S.r==='PTP'?' · Theo ủy quyền của Trưởng phòng':''}</span></button>`).join(''):'<div class="empty">Chưa có hồ sơ nào chờ bạn ký.</div>'}</div>`}
function task(){
  const t=S.taskDetail;
  if(S.detailLoading)return'<div class="pn"><div class="empty">Đang tải chi tiết nhiệm vụ...</div></div>';
  if(S.taskError)return`<div class="err" role="alert">${esc(S.taskError)} <button class="btn" onclick="loadTaskDetail(${Number(S.p.id)})">Thử lại</button></div>`;
  if(!t)return'<div class="empty">Không tìm thấy nhiệm vụ.</div>';
  const mine=t.is_mine===true||t.to===S.u.id,fin=t.st==='DONE'||t.st==='CANCELLED';
  return `<div class="cols"><div class="pn"><h2>${esc(t.title)} ${pill(esc(dlLabel(t)),dlCls(t))}</h2><dl class="kv"><dt>Mã</dt><dd>${esc(t.code||'')}</dd><dt>Lĩnh vực</dt><dd>${esc(t.fieldName||FIELD[t.f]||'')}</dd><dt>Người giao</dt><dd>${esc(t.byName||'')}</dd><dt>Người xử lý</dt><dd>${esc(t.assigneeName||'')}</dd><dt>Mức ưu tiên</dt><dd>${esc(PRI[t.pri]||t.pri||'')}</dd><dt>Thời gian</dt><dd>${t.start?fmt(t.start):'—'} – ${t.due?fmt(t.due):'—'} (${esc(dlTxt(t))})</dd><dt>Nội dung</dt><dd>${esc(t.desc||'Chưa có mô tả')}</dd><dt>Tệp đính kèm</dt><dd>${t.files.length?t.files.map(esc).join(', '):'Không có'}</dd><dt>Tiến độ</dt><dd style="display:flex;gap:8px;align-items:center">${bar(t.pr)} ${t.pr}% ${pill(ST[t.st]||t.st,fin?'gr':'')}</dd></dl></div>
<div><div class="pn"><h2>Cập nhật tiến độ</h2>${fin?'<div class="empty">Nhiệm vụ đã kết thúc, không thể cập nhật.</div>':!mine?'<div class="empty">Chỉ người được giao mới cập nhật tiến độ. Bạn đang xem ở chế độ chỉ đọc.</div>':`<div class="fm"><div style="display:flex;gap:16px"><label><input type="radio" name="st" value="IN_PROGRESS" checked onchange="selSt(this.value)">Đang làm</label><label><input type="radio" name="st" value="DONE" onchange="selSt(this.value)">Hoàn thành</label></div>
<label>Tiến độ <input type="range" id="pr" min="0" max="100" step="5" value="${t.pr}" oninput="$('#prv').textContent=this.value+'%'"><b id="prv">${t.pr}%</b></label><textarea id="nt" rows="3" placeholder="Ghi chú kết quả hoặc vướng mắc"></textarea>${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}${S.conflictReload?`<div><button class="btn" onclick="reloadTask(${t.id})">Tải lại nhiệm vụ</button></div>`:''}<div><button class="btn p" onclick="saveTask(${t.id})" ${S.savingTask?'disabled':''}>Lưu cập nhật</button></div></div>`}</div>
<div class="pn" style="margin-top:16px"><h2>Lịch sử cập nhật</h2>${t.hist.length?t.hist.map(h=>`<div class="row"><span>${esc(ST[h.from]||h.from)} → ${esc(ST[h.to]||h.to)}, ${h.pr}%${h.note?' · '+esc(h.note):''}</span><span class="mu">${esc(h.who||'')} ${h.at.toLocaleDateString('vi-VN')} ${h.at.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="empty">Chưa có cập nhật nào.</div>'}</div></div></div>`
}
function view(){return({today,mine:tasks,tasks,docs,doc,appr,task})[S.v]()}
function render(){const a=$('#app');document.body.classList.toggle('login-view',!S.u);a.innerHTML=!S.u?login():demoBar()+`<div class="app">${side()}<main>${topbar()}${view()}</main></div>`}
render();void initialize();
</script>
</body>
</html>
